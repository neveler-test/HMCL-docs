name: PR Preview

on:
  schedule:
    - cron: 0 0 */6 * *
  pull_request_target:
    types:
      - closed
  workflow_run:
    workflows:
      - "PR Preview Build"
    types:
      - completed

concurrency:
  group: pr-preview
  cancel-in-progress: false

jobs:
  cache-refresh:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cache Refresh
        uses: actions/cache/restore@v6
        with:
          key: pages-${{ github.run_id }}
          path: ${{ runner.temp }}/pages
          restore-keys: pages-
  remove:
    if: ${{ github.event_name == 'pull_request_target'}}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - id: restore-pages
        name: Restore Pages
        uses: actions/cache/restore@v6
        with:
          key: pages-${{ github.run_id }}
          path: ${{ runner.temp }}/pages
          restore-keys: pages-
      - name: Prepare Pages
        run: |
          mkdir -p ${{ runner.temp }}/pages/data/{files,refs}
          rm -rf ${{ runner.temp }}/pages/PR${{ env.PULL_REQUEST_NUMBER }}
          grep -rlw 'PR${{ env.PULL_REQUEST_NUMBER }}' ${{ runner.temp }}/pages/data/refs | xargs -r sed -i '/\<PR${{ env.PULL_REQUEST_NUMBER }}\>/d'
          for ref in ${{ runner.temp }}/pages/data/refs/*; do
            if [ ! -s "$ref" ]; then
              base=$(basename "$ref")
              rm -f "${{ runner.temp }}/pages/data/files/$base"
              rm -f "$ref"
            fi
          done
          echo "[$(date)] Remove Preview PR${{ env.PULL_REQUEST_NUMBER }}" > ${{ runner.temp }}/pages/index.html
      - name: Save Pages
        uses: actions/cache/save@v6
        with:
          key: pages-${{ github.run_id }}
          path: ${{ runner.temp }}/pages
      - if: ${{ steps.restore-pages.outputs.cache-matched-key }}
        name: Remove History Cache
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.actions.deleteActionsCacheByKey({
              owner: context.repo.owner,
              repo: context.repo.repo,
              key: "${{ steps.restore-pages.outputs.cache-matched-key }}"
            });
  deploy:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ env.PREVIEW_DOMAIN }}${{ env.PREVIEW_PATHNAME }}/PR${{ env.PULL_REQUEST_NUMBER }}
    permissions:
      actions: write
      pages: write
      id-token: write
      contents: write
    env:
      PREVIEW_DOMAIN: ${{ github.repository_owner }}.github.io
      PREVIEW_PATHNAME: ${{ github.event.repository.name != format('{0}.github.io', github.repository_owner) && format('/{0}', github.event.repository.name) || '' }}
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact
          path: ${{ runner.temp }}/artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare
        uses: actions/github-script@v9
        env:
          SITE_PATH: ${{ runner.temp }}/artifact/site
          PULL_REQUEST_NUMBER_PATH: ${{ runner.temp }}/artifact/PULL_REQUEST_NUMBER
        with:
          script: |
            import fs from "fs";

            const prNumberPath = process.env.PULL_REQUEST_NUMBER_PATH;
            if (!prNumberPath || !fs.existsSync(prNumberPath) || !fs.statSync(prNumberPath).isFile()) {
              throw new Error("Pull request number file not found.");
            }

            const sitePath = process.env.SITE_PATH;
            if (!sitePath || !fs.existsSync(sitePath) || !fs.statSync(sitePath).isDirectory()) {
              throw new Error("Site dir not found.");
            }

            const PULL_REQUEST_NUMBER = parseInt(fs.readFileSync(prNumberPath, "utf8").trim(), 10);
            if (isNaN(PULL_REQUEST_NUMBER)) {
              throw new Error("Failed to parse the pull request number.");
            }

            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: PULL_REQUEST_NUMBER });
            core.info(`Current PR state: ${pr.state}`);
            if (pr.state !== "open") {
              throw new Error("The pull request is not open.");
            }

            const run = context.payload.workflow_run;
            if (!run) {
              throw new Error("context.payload.workflow_run is undefined. Ensure this script runs on the 'workflow_run' event.");
            }

            if (pr.head.sha !== run.head_sha) {
              throw new Error("PR head SHA does not match the workflow run head SHA.");
            }

            if (pr.head.ref !== run.head_branch) {
              throw new Error("PR head branch does not match the workflow run head branch.");
            }

            if (pr.head.repo.full_name !== run.head_repository.full_name) {
              throw new Error("PR head repository fullname does not match the workflow run head repository fullname.");
            }

            core.exportVariable('PULL_REQUEST_NUMBER', PULL_REQUEST_NUMBER);
      - id: restore-pages
        name: Restore Pages
        uses: actions/cache/restore@v4
        with:
          key: pages-${{ github.run_id }}
          path: ${{ runner.temp }}/pages
          restore-keys: pages-
      - name: Merge Site Before
        run: |
          mkdir -p ${{ runner.temp }}/pages/data/{files,refs}
          rm -rf ${{ runner.temp }}/pages/PR${{ env.PULL_REQUEST_NUMBER }}
          grep -rlw 'PR${{ env.PULL_REQUEST_NUMBER }}' ${{ runner.temp }}/pages/data/refs | xargs -r sed -i '/\<PR${{ env.PULL_REQUEST_NUMBER }}\>/d'
      - name: Merge Site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact
          path: ${{ runner.temp }}/pages/PR${{ env.PULL_REQUEST_NUMBER }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge Site After
        run: |
          find ${{ runner.temp }}/pages/PR${{ env.PULL_REQUEST_NUMBER }} -type f | while read file; do
            hash=$(sha256sum "$file" | cut -d' ' -f1)
            size=$(stat -c%s "$file")
            key="${hash}-${size}"
            target="${{ runner.temp }}/pages/data/files/$key"
            if [ ! -f "$target" ]; then
              mv "$file" "$target"
            else
              rm -f "$file"
            fi
            ln -s "$(realpath --relative-to="$(dirname "$file")" "$target")" "$file"
            echo "PR${{ env.PULL_REQUEST_NUMBER }}" >> "${{ runner.temp }}/pages/data/refs/$key"
          done
          for ref in ${{ runner.temp }}/pages/data/refs/*; do
            if [ ! -s "$ref" ]; then
              base=$(basename "$ref")
              rm -f "${{ runner.temp }}/pages/data/files/$base"
              rm -f "$ref"
            fi
          done
          echo "[$(date)] Preview PR${{ env.PULL_REQUEST_NUMBER }}" > ${{ runner.temp }}/pages/index.html
      - id: upload-pages
        name: Upload Pages
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
      - name: Save Pages
        uses: actions/cache/save@v4
        with:
          key: pages-${{ github.run_id }}
          path: ${{ runner.temp }}/pages
      - if: ${{ steps.restore-pages.outputs.cache-matched-key }}
        name: Remove History Cache
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.actions.deleteActionsCacheByKey({
              owner: context.repo.owner,
              repo: context.repo.repo,
              key: "${{ steps.restore-pages.outputs.cache-matched-key }}"
            });
      - if: ${{ steps.upload-pages.outputs.artifact_id }}
        name: Remove Pages Artifact
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: "${{ steps.upload-pages.outputs.artifact_id }}",
            });
      - if: ${{ needs.preview-create-build.outputs.artifact-id }}
        name: Remove Temp Artifact
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: "${{ needs.preview-create-build.outputs.artifact-id }}"
            });
